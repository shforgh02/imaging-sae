<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="500" viewBox="0 0 1060 500"><rect width="1060" height="500" fill="#fcfcfb"/><text x="20.0" y="28.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 2. Study flow</text><rect x="10" y="40" width="1040" height="282" fill="none" stroke="#e1e0d9" stroke-width="1.5" rx="8"/><text x="20.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="bold">INTERNAL TESTING: NLST, one trial (33 US centres, enrolment 2002-2004). Every split, including the participants Sybil never used, is internal.</text><rect x="302.0" y="68.0" width="460.0" height="46.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="312.0" y="88.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">NLST CT arm (public tables): 26,453 participants</text><text x="312.0" y="104.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Sybil's published split file: 15,019; not in it: 11,434</text><line x1="532.0" y1="114.0" x2="532.0" y2="132.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M532.0,132.0 l-4,-8 l8,0 Z" fill="#52514e"/><line x1="142.0" y1="132.0" x2="922.0" y2="132.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><line x1="142.0" y1="132.0" x2="142.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M142.0,148.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="20.0" y="148.0" width="245.0" height="126.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="30.0" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's train split</text><text x="30.0" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">10,179 participants, 29,932 exams</text><text x="30.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Sybil was trained here (by its developers)</text><text x="30.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">we fit only the radiologists' forms here:</text><text x="30.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">1-year: 29,752 exams (180 without a</text><text x="30.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">  1-year outcome), 452 cancers</text><text x="30.0" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">6-year: 9,009 baseline exams, 707 cancers</text><line x1="402.0" y1="132.0" x2="402.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M402.0,148.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="280.0" y="148.0" width="245.0" height="126.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="290.0" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's dev split (discovery)</text><text x="290.0" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">2,493 participants, 7,362 exams in tables</text><text x="290.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">7,361 CT studies on IDC; 13 without</text><text x="290.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">  an eligible series, 12 duplicate person-years</text><text x="290.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">7,336 scored (2,492 participants; 0 failed)</text><text x="290.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Sybil's model selection split: in-sample</text><text x="290.0" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">used for our discovery work</text><line x1="662.0" y1="132.0" x2="662.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M662.0,148.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="540.0" y="148.0" width="245.0" height="126.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" rx="6"/><text x="550.0" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's test split (held out)</text><text x="550.0" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">2,347 participants, 6,937 exams in tables</text><text x="550.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">split file: 6,715 series, all scored (0 failed)</text><text x="550.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">+ 759 z-fix runs, 500 kernel pairs</text><text x="550.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">1-year: 6,674 exams (41 unknown), 86 cancers</text><text x="550.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">6-year, baseline: 2,002 of 2,279 (277 censored),</text><text x="550.0" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">  131 cancers. Six pre-registered tests</text><line x1="922.0" y1="132.0" x2="922.0" y2="148.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M922.0,148.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="800.0" y="148.0" width="245.0" height="126.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#898781" stroke-width="1.5" rx="6" stroke-dasharray="6,4"/><text x="810.0" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Never used by Sybil</text><text x="810.0" y="184.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">11,434 participants (11,432 with 30,888 exams)</text><text x="810.0" y="200.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">11,235 with CT on IDC; 11,226 kept</text><text x="810.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">  (28,661 exams); 23,552 not</text><text x="810.0" y="232.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">  overlapping and not a partner scan</text><text x="810.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">4,298 overlapping scans (2,095 people)</text><text x="810.0" y="264.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">+ 811 partner scans; pre-registered, from 1 Dec</text><text x="20.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Only 34 of the never-used participants have a later lung cancer, so this group tests the mechanism, not cancer detection.</text><text x="20.0" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Exams with an unknown outcome are left out only of the analyses that need that outcome. Sybil's developers do not state why participants are outside the split file.</text><text x="20.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="bold">EXTERNAL REPLICATION OF THE MECHANISM</text><text x="540.0" y="350.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" fill="#52514e" text-anchor="start" font-weight="bold">HOW COMMON THE GEOMETRY IS TODAY (HEADERS ONLY)</text><rect x="20.0" y="360.0" width="500.0" height="62.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#eb6834" stroke-width="1.5" rx="6"/><text x="30.0" y="380.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">LIDC-IDRI (7 US academic centres; clinical CT, not screening)</text><text x="30.0" y="396.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">1,010 patients (1,018 CT series) → 197 with a strongly overlapping series</text><text x="30.0" y="412.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">(one per patient; GE 134, Philips 46, Siemens 17); no cancer outcome</text><rect x="540.0" y="360.0" width="500.0" height="62.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="550.0" y="380.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Imaging Data Commons, all CT collections (no model run)</text><text x="550.0" y="396.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">270,830 CT series → 135,199 axial chest series → 113,592 at ≤ 3 mm</text><text x="550.0" y="412.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">(71,471 studies, 28,277 patients, 61 collections)</text><text x="20.0" y="464.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Edges: blue = confirmatory (pre-registered, test split); orange = exploratory external replication; dashed grey = pre-registered, not yet run.</text><text x="20.0" y="480.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Image data: NLST on Imaging Data Commons (CC BY 4.0), LIDC-IDRI (CC BY 3.0); outcomes from the NLST tables. Selection rules and cut-offs: Methods and Supplement.</text></svg>
