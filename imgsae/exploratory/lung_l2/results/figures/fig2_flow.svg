<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560"><rect width="1060" height="560" fill="#fcfcfb"/><text x="20.0" y="28.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 2. Study flow</text><rect x="300.0" y="50.0" width="420.0" height="46.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="310.0" y="70.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">NLST, CT arm (public tables, IDC): 26,453 participants</text><text x="310.0" y="86.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">CT images and DICOM headers from IDC; outcomes from the NLST tables</text><line x1="510.0" y1="98.0" x2="510.0" y2="128.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M510.0,128.0 l-4,-8 l8,0 Z" fill="#52514e"/><line x1="130.0" y1="128.0" x2="930.0" y2="128.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><line x1="140.0" y1="128.0" x2="140.0" y2="150.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M140.0,150.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="20.0" y="150.0" width="240.0" height="78.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="30.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's train split</text><text x="30.0" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">10,179 participants, 29,932 exams</text><text x="30.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Sybil was trained here (by its developers)</text><text x="30.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">we fit only the radiologists' forms (F, P) here</text><line x1="400.0" y1="128.0" x2="400.0" y2="150.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M400.0,150.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="280.0" y="150.0" width="240.0" height="78.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="290.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's dev split</text><text x="290.0" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">2,493 participants; 7,336 series scored</text><text x="290.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">Sybil's model selection split: in-sample</text><text x="290.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">our discovery work; X11 (mechanism, no outcome)</text><line x1="660.0" y1="128.0" x2="660.0" y2="150.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M660.0,150.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="540.0" y="150.0" width="240.0" height="94.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" rx="6"/><text x="550.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Sybil's test split (held out)</text><text x="550.0" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">2,347 participants; 6,715 series scored</text><text x="550.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">+ 759 z-fix runs, 500 kernel pairs</text><text x="550.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">1-year outcome: 6,674 exams, 86 cancers</text><text x="550.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">six pre-registered tests; exploratory X1-X10</text><line x1="920.0" y1="128.0" x2="920.0" y2="150.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><path d="M920.0,150.0 l-4,-8 l8,0 Z" fill="#52514e"/><rect x="800.0" y="150.0" width="240.0" height="94.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#eb6834" stroke-width="1.5" rx="6"/><text x="810.0" y="170.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Never used by Sybil (O2)</text><text x="810.0" y="186.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">11,434 participants, 30,888 exams</text><text x="810.0" y="202.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">lists: U1 4,298 series, U2 811 series</text><text x="810.0" y="218.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">pre-registered; scoring from 1 Dec 2026</text><text x="810.0" y="234.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">(cancer-poor: 34 with a later cancer)</text><text x="20.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">All NLST groups are the same trial (33 US centres, 2002-2004 enrolment): every NLST result is internal testing, including O2.</text><rect x="20.0" y="320.0" width="480.0" height="62.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#2a78d6" stroke-width="1.5" rx="6"/><text x="30.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">LIDC-IDRI (7 US academic centres; clinical CT, not screening)</text><text x="30.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">197 scans with overlapping slices (one per patient; GE 134, Philips 46, Siemens 17)</text><text x="30.0" y="372.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">external replication of the mechanism only (no cancer outcome)</text><rect x="540.0" y="320.0" width="480.0" height="62.0" fill="#fcfcfb" fill-opacity="1.0" stroke="#c3c2b7" stroke-width="1.5" rx="6"/><text x="550.0" y="340.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">Imaging Data Commons, all chest CT (DICOM headers only)</text><text x="550.0" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">how common overlapping series are today (X12); no model run</text><text x="550.0" y="372.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">NLST collection licence CC BY 4.0; LIDC-IDRI CC BY 3.0</text><text x="20.0" y="430.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Selection rules, exclusions at each step and the cut-offs are in the protocol (section 5), O2_PLAN.md and RESULTS_L2.md 3d, 3i.</text><text x="20.0" y="446.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">Blue edge: confirmatory results (test) and the external mechanism replication; orange edge: pre-registered, not yet run.</text></svg>
