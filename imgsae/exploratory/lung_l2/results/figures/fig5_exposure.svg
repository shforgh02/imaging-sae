<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640"><rect width="960" height="640" fill="#fcfcfb"/><text x="20.0" y="28.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 5. How often a chest CT study holds an overlapping series (public data, DICOM headers only)</text><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fcfcfb"/><line x1="0" y1="0" x2="0" y2="6" stroke="#898781" stroke-width="2"/></pattern></defs><line x1="330.0" y1="62.0" x2="330.0" y2="288.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="330.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">0%</text><line x1="460.0" y1="62.0" x2="460.0" y2="288.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="460.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">10%</text><line x1="590.0" y1="62.0" x2="590.0" y2="288.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="590.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">20%</text><line x1="720.0" y1="62.0" x2="720.0" y2="288.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="720.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">30%</text><line x1="850.0" y1="62.0" x2="850.0" y2="288.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="850.0" y="302.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">40%</text><text x="330.0" y="318.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">share of studies</text><text x="20.0" y="90.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">NLST (2002-2004 scanners)</text><text x="20.0" y="105.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">67,184 studies, 24,707 people</text><rect x="330.0" y="76.0" width="112.7" height="22.0" fill="#2a78d6" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="442.7" y="76.0" width="3.4" height="22.0" fill="#86b6ef" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="446.2" y="76.0" width="333.5" height="22.0" fill="url(#hatch)" fill-opacity="1.0" stroke="#898781" stroke-width="1" rx="0"/><line x1="441.9" y1="105.0" x2="450.5" y2="105.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><line x1="441.9" y1="102.0" x2="441.9" y2="108.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><line x1="450.5" y1="102.0" x2="450.5" y2="108.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><text x="450.2" y="71.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">strong 8.9% (8.7% + 0.3%)</text><text x="785.7" y="91.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">+ moderate only 25.7%</text><text x="20.0" y="164.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">Modern scanner models (2013 or later)</text><text x="20.0" y="179.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">189 studies, 144 people</text><rect x="330.0" y="150.0" width="6.9" height="22.0" fill="#2a78d6" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="336.9" y="150.0" width="41.3" height="22.0" fill="#86b6ef" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="378.1" y="150.0" width="199.5" height="22.0" fill="url(#hatch)" fill-opacity="1.0" stroke="#898781" stroke-width="1" rx="0"/><line x1="337.3" y1="179.0" x2="432.8" y2="179.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><line x1="337.3" y1="176.0" x2="337.3" y2="182.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><line x1="432.8" y1="176.0" x2="432.8" y2="182.0" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/><text x="382.1" y="145.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">strong 3.7% (0.5% + 3.2%)</text><text x="583.6" y="165.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">+ moderate only 15.3%</text><text x="20.0" y="238.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="normal">Public chest CT collections (2015 or later)</text><text x="20.0" y="253.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">1,146 studies, 756 people</text><rect x="330.0" y="224.0" width="18.2" height="22.0" fill="#2a78d6" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="348.2" y="224.0" width="62.4" height="22.0" fill="#86b6ef" fill-opacity="1.0" stroke="#fcfcfb" stroke-width="1" rx="0"/><rect x="410.5" y="224.0" width="79.4" height="22.0" fill="url(#hatch)" fill-opacity="1.0" stroke="#898781" stroke-width="1" rx="0"/><line x1="386.1" y1="253.0" x2=