<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600"><rect width="1060" height="600" fill="#fcfcfb"/><text x="20.0" y="28.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="bold">Figure 4. Where the slice-spacing effect sits inside Sybil</text><text x="20.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">a</text><text x="36.0" y="58.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#0b0b0b" text-anchor="start" font-weight="bold">NLST test, pre-registered (H2, H6, H7): mean change of Sybil's logit</text><text x="36.0" y="74.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">as Sybil gives it, and with shared axis 0 switched off (set to its dev mean in all five members; nothing refitted)</text><line x1="272.0" y1="94.0" x2="272.0" y2="322.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="272.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">-0.4</text><line x1="316.0" y1="94.0" x2="316.0" y2="322.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="316.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">-0.2</text><line x1="360.0" y1="94.0" x2="360.0" y2="322.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="360.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">0</text><line x1="404.0" y1="94.0" x2="404.0" y2="322.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="404.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">0.2</text><line x1="448.0" y1="94.0" x2="448.0" y2="322.0" stroke="#e1e0d9" stroke-width="1" stroke-linecap="round"/><text x="448.0" y="336.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="middle" font-weight="normal">0.4</text><line x1="360.0" y1="94.0" x2="360.0" y2="322.0" stroke="#52514e" stroke-width="1.5" stroke-linecap="round"/><text x="360.0" y="90.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#52514e" text-anchor="middle" font-weight="normal">no change</text><text x="360.0" y="352.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="middle" font-weight="normal">mean change of the logit (z-fix minus as read; later minus earlier screen per stretch change)</text><text x="20.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">z-fix, 1-year logit</text><text x="20.0" y="132.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">759 stretched exams, 342 people</text><line x1="269.5" y1="116.0" x2="289.6" y2="116.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="279.4" cy="116.0" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="482.0" y="120.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal">as Sybil gives it: -0.366 [-0.411, -0.320]</text><line x1="358.9" y1="138.0" x2="379.1" y2="138.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="368.8" cy="138.0" r="4.5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="482.0" y="142.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">axis 0 off: +0.040 [-0.005, +0.087]</text><text x="20.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">z-fix, 6-year logit</text><text x="20.0" y="206.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">same exams</text><line x1="293.5" y1="190.0" x2="311.4" y2="190.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="302.2" cy="190.0" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="482.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal">as Sybil gives it: -0.263 [-0.302, -0.221]</text><line x1="360.8" y1="212.0" x2="378.9" y2="212.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="369.6" cy="212.0" r="4.5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="482.0" y="216.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">axis 0 off: +0.044 [+0.004, +0.086]</text><text x="20.0" y="266.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#0b0b0b" text-anchor="start" font-weight="bold">follow-up jump b, 1-year</text><text x="20.0" y="280.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">4,353 yearly pairs, 134 changed stretch</text><line x1="400.6" y1="264.0" x2="455.7" y2="264.0" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/><circle cx="428.4" cy="264.0" r="4.5" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="482.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#52514e" text-anchor="start" font-weight="normal">as Sybil gives it: +0.311 [+0.185, +0.435]</text><line x1="321.5" y1="286.0" x2="377.2" y2="286.0" stroke="#898781" stroke-width="2" stroke-linecap="round"/><circle cx="349.9" cy="286.0" r="4.5" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="482.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">axis 0 off: -0.046 [-0.175, +0.078]</text><text x="20.0" y="376.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Switching axis 0 off removes the mean shift, not the exam-by-exam scatter: z-fix exams whose 1-year logit moves &gt;= 1/4 SD:</text><text x="20.0" y="390.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">70.8% as Sybil gives it, 54.0% with axis 0 off. 1-year AUROC with axis 0 off minus as given: -0.0003 [-0.005, +0.003] (no change detected; secondary).</text><text x="20.0" y="404.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">The z-fix moves axis 0 by -2.73 dev SD [-2.76, -2.70]; a change of stretch between yearly screens moves it by</text><text x="20.0" y="418.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">2.39 dev SD [2.28, 2.50]. H7 is partly seen before the freeze; 121 of its 134 changed pairs involve GE.</text><text x="20.0" y="470.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">b</text><text x="36.0" y="470.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">X11 arm B: synthetic stretch on non-overlapping dev scans (axis 0 and the logit against the stretch factor)</text><text x="36.0" y="486.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">dev, exploratory; drawn when the X11 analysis is committed</text><text x="20.0" y="520.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#0b0b0b" text-anchor="start" font-weight="bold">c</text><text x="36.0" y="520.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#52514e" text-anchor="start" font-weight="normal">X11 arm A: the z-fix shift split into padding value, box filling, constant slab and every-second-slice decimation</text><text x="36.0" y="536.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#898781" text-anchor="start" font-weight="normal">dev, exploratory; drawn when the X11 analysis is committed</text></svg>
