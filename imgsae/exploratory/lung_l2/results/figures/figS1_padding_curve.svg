94.7 L454.4,290.2 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><line x1="500.8" y1="292.5" x2="500.8" y2="292.3" stroke="#eb6834" stroke-width="1.6" stroke-linecap="round"/><path d="M500.8,287.9 L505.3,292.4 L500.8,296.9 L496.3,292.4 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><line x1="542.7" y1="293.0" x2="542.7" y2="292.7" stroke="#eb6834" stroke-width="1.6" stroke-linecap="round"/><path d="M542.7,288.3 L547.2,292.8 L542.7,297.3 L538.2,292.8 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><line x1="584.5" y1="294.0" x2="584.5" y2="293.4" stroke="#eb6834" stroke-width="1.6" stroke-linecap="round"/><path d="M584.5,289.2 L589.0,293.7 L584.5,298.2 L580.0,293.7 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><line x1="623.8" y1="294.9" x2="623.8" y2="294.1" stroke="#eb6834" stroke-width="1.6" stroke-linecap="round"/><path d="M623.8,290.0 L628.3,294.5 L623.8,299.0 L619.3,294.5 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><circle cx="680.0" cy="88.0" r="4" fill="#2a78d6" stroke="#fcfcfb" stroke-width="1.5"/><text x="692.0" y="92.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">overlapping (ratio &lt;= 0.65): 924 scans</text><rect x="676.0" y="102.0" width="8" height="8" fill="#fcfcfb" stroke="#898781" stroke-width="2"/><text x="692.0" y="110.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">moderate overlap (0.65-0.95): 2,255 scans</text><path d="M680.0,119.0 L685.0,124.0 L680.0,129.0 L675.0,124.0 Z" fill="#eb6834" stroke="#fcfcfb" stroke-width="1.5"/><text x="692.0" y="128.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#52514e" text-anchor="start" font-weight="normal">contiguous (0.95-1.05): 4,138 scans</text><text x="672.0" y="162.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Where groups share a bin they agree within about 0.1 SD (49-56: -0.39, -0.37, -0.39):</text><text x="672.0" y="177.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">axis 0 depends on how much padding is left, not on why it is thin.</text><text x="672.0" y="192.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Contiguous scans: 80% have more than 64 padded slices (flat part);</text><text x="672.0" y="207.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">1.5% have 48 or fewer.</text><text x="672.0" y="222.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Moderate overlap: 413 of 2,255 (18%) have 32 or fewer (steep part).</text><text x="672.0" y="237.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Not drawn: 19 scans with gaps (ratio &gt; 1.05) or ratio 0;</text><text x="672.0" y="252.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">bins with fewer than 5 scans.</text><text x="672.0" y="267.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Observational: scans with thin padding may differ in other ways too;</text><text x="672.0" y="282.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">the experiments of Figure 4 (b, c) point the same way.</text><text x="20.0" y="368.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">Each point: mean axis 0 with its 95% participant-bootstrap interval; points of a bin are spread sideways. The 8-slice bins were added after an outside review (post hoc);</text><text x="20.0" y="382.0" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" fill="#898781" text-anchor="start" font-weight="normal">the planned 16-slice bins (results/x11/x11_padcurve_dev.json) give the same picture except that the wide 33-48 bin mixes the steep part.</text></svg>
